version: "3"

includes:
  docs: ./docs

tasks:
  release:
    cmds:
      - commit-and-tag-version {{.CLI_ARGS}}
      - git push --follow-tags origin main
  migration:create:
    cmds:
      - atlas migrate diff --env gorm_postgres {{.CLI_ARGS}}
      - atlas migrate diff --env gorm_sqlite {{.CLI_ARGS}}
  proto:build:
    desc: Validate and build all proto files using buf
    cmds:
      - buf build
  proto:generate:
    desc: Generate Go gRPC, grpc-gateway, AIP helpers, and OpenAPI docs from proto files
    cmds:
      - buf generate
  web:install:
    desc: Install Angular dependencies
    dir: web
    cmds:
      - npm ci
  web:build:
    desc: Build Angular application for production
    dir: web
    cmds:
      - npm run build
  web:generateApiV2:
    desc: Generate API client
    dir: web
    cmds:
      - npm run generate:apiV2
      - cmd: powershell -NoProfile -Command '$p="src/lib/api/models/v1nested-account.ts";$c=[IO.File]::ReadAllText($p);[IO.File]::WriteAllText($p,($c -replace "(?m)^import \{ V1NestedAccount \} from \x27\./v1nested-account\x27;\r?\n?",""))'
        platforms: [windows]
      - cmd: sed -i "/^import { V1NestedAccount } from '\.\/v1nested-account';$/d" src/lib/api/models/v1nested-account.ts
        platforms: [linux]
  build:
    desc: Full production build (web + Go with embedded assets)
    cmds:
      - task: web:build
      - go build -tags web -o vsfv{{exeExt}} .
  build:dev:
    desc: Build Go without web assets
    cmds:
      - go build -o vsfv{{exeExt}} .