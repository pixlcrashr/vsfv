server:
  # Address and port the HTTP server listens on.
  addr: "127.0.0.1:8080"
  # Address and port for the gRPC server (reserved for future use).
  grpc-addr: "127.0.0.1:9090"
  # Public-facing URL of the server. Used as the OAuth2 issuer and for redirect URIs.
  public-url: "http://127.0.0.1:8080"

database:
  # PostgreSQL connection string.
  url: "postgres://user:password@localhost:5432/vsfv?sslmode=disable"

auth:
  # Random secret used to sign session tokens. Generate with: openssl rand -hex 32
  secret: "change-me"
  # Access token lifetime. Defaults to 1h.
  token-ttl: "1h"
  # Refresh token lifetime. Defaults to 720h (30 days).
  refresh-ttl: "720h"
  # Auth session lifetime (browser login session). Defaults to 24h.
  session-ttl: "24h"
  # Set the Secure flag on auth cookies. Enable when serving over HTTPS.
  secure-cookies: false
  # Additional redirect URIs for the web OAuth2 client.
  # Defaults to {public-url}/login if empty.
  web-redirect-uris: []
  # JWKS key files for signing JWTs. Leave empty to auto-generate keys.
  jwks:
    key-files: []
  gitlab:
    # Enable GitLab OAuth2 login. Defaults to false.
    enabled: false
    # GitLab OAuth2 application credentials.
    client-id: "your-gitlab-client-id"
    client-secret: "your-gitlab-client-secret"
    # Base URL of the GitLab instance used as the OAuth2 issuer.
    issuer: "https://gitlab.com"
  password:
    # Enable password-based login (users created via the adduser CLI tool
    # can then sign in with email and password). Defaults to false.
    enabled: false

gotenberg:
  # URL of the Gotenberg HTTP server for PDF conversion.
  url: "http://127.0.0.1:3000"

cors:
  # Enable CORS middleware. Defaults to false.
  enabled: false
  # Allowed origins. Defaults to ["*"].
  allow-origins:
    - "*"
  # Allowed HTTP methods. Defaults to common methods.
  allow-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  # Allowed request headers.
  allow-headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
  # Response headers exposed to the client. Defaults to empty.
  expose-headers: []
  # Whether to allow credentials (cookies, auth headers).
  allow-credentials: false
  # Preflight cache duration in seconds.
  max-age: 300
