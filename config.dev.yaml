server:
  addr: "127.0.0.1:8080"
  grpc-addr: "127.0.0.1:9090"
  # Must share the host ("localhost") with the SPA dev server so the login
  # session cookie set via the API is a first-party (same-site) cookie.
  # Browsers drop cookies set across localhost <-> 127.0.0.1.
  public-url: "http://localhost:8080"

database:
  # dsn: "postgres://vsf:postgres@127.0.0.1:5334/vsf?sslmode=disable"
  dsn: sqlite://dev.sqlite

auth:
  secret: "dev-secret-do-not-use-in-production"
  gitlab:
    enabled: false
    client-id: "clientID"
    client-secret: "clientSecret"
    issuer: "https://gitlab.oauth-provider.com"
  password:
    enabled: true
  web-redirect-uris:
    - "http://localhost:4200/login"
    - "http://localhost:8080/login"
    - "http://127.0.0.1:8080/login"
gotenberg:
  url: "http://127.0.0.1:3000"
cors:
  enabled: true
  allow-origins:
    - "http://localhost:4200"
    - "http://127.0.0.1:4200"
  allow-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow-headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
  allow-credentials: true
  max-age: 300
