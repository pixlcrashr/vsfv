syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "pixlcrashr/vsfv/v1/decimal.proto";
import "pixlcrashr/vsfv/v1/ledger_account.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// Transaction represents a financial transaction between two transaction accounts.
message Transaction {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/Transaction"
    pattern: "organizations/{organization}/transactions/{transaction}"
  };

  // The resource name of the transaction.
  // Format: organizations/{organization}/transactions/{transaction}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the transaction.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // Resource name of the credit ledger account.
  // Format: organizations/{organization}/ledgerAccounts/{ledger_account}
  string credit_ledger_account = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/LedgerAccount"}
  ];

  // Resource name of the debit ledger account.
  // Format: organizations/{organization}/ledgerAccounts/{ledger_account}
  string debit_ledger_account = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/LedgerAccount"}
  ];

  // Transaction amount.
  Decimal amount = 5 [(google.api.field_behavior) = REQUIRED];

  // Human-readable transaction description. Immutable after creation;
  // UpdateTransaction rejects update masks that include this field.
  string description = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // External reference identifier.
  string reference = 7 [(google.api.field_behavior) = OPTIONAL];

  // Booking date.
  google.protobuf.Timestamp booked_at = 9 [(google.api.field_behavior) = REQUIRED];

  // Document date.
  google.protobuf.Timestamp document_date = 10 [(google.api.field_behavior) = REQUIRED];

  // Optional document ID.
  string document_id = 11 [(google.api.field_behavior) = OPTIONAL];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetTransactionRequest {
  // The resource name of the transaction.
  // Format: organizations/{organization}/transactions/{transaction}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Transaction"}
  ];
}

message ListTransactionsRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // Maximum number of transactions to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListTransactions call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: credit_ledger_account, debit_ledger_account,
  // booked_at, document_date, amount.
  // Example: "credit_ledger_account=\"organizations/{organization}/ledgerAccounts/{ledger_account}\" AND booked_at>=\"2025-01-01T00:00:00Z\"".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "booked_at desc", "amount").
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListTransactionsResponse {
  // The transactions returned.
  repeated Transaction transactions = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of transactions matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateTransactionRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // The transaction to create.
  Transaction transaction = 2 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the transaction. If not provided, a system-generated
  // UUID will be used. Must be unique within the parent organization.
  string transaction_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateTransactionRequest {
  // The transaction to update.
  Transaction transaction = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteTransactionRequest {
  // The resource name of the transaction.
  // Format: organizations/{organization}/transactions/{transaction}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Transaction"}
  ];
}

// TransactionService manages financial transactions.
service TransactionService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single transaction by resource name.
  // Authorization:
  //   Scope: transactions:read
  //   Permission: transactions:read
  //   Domain: organization-scoped
  rpc GetTransaction(GetTransactionRequest) returns (Transaction) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/transactions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists transactions with keyset pagination and optional filters.
  // Authorization:
  //   Scope: transactions:read
  //   Permission: transactions:read
  //   Domain: organization-scoped
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/transactions"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a new transaction.
  // Authorization:
  //   Scope: transactions:write
  //   Permission: transactions:create
  //   Domain: organization-scoped
  rpc CreateTransaction(CreateTransactionRequest) returns (Transaction) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/transactions"
      body: "transaction"
    };
    option (google.api.method_signature) = "parent,transaction,transaction_id";
  }

  // Updates an existing transaction.
  // Authorization:
  //   Scope: transactions:write
  //   Permission: transactions:update
  //   Domain: organization-scoped
  rpc UpdateTransaction(UpdateTransactionRequest) returns (Transaction) {
    option (google.api.http) = {
      patch: "/v1/{transaction.name=organizations/*/transactions/*}"
      body: "transaction"
    };
    option (google.api.method_signature) = "transaction,update_mask";
  }

  // Permanently deletes a transaction.
  // Authorization:
  //   Scope: transactions:write
  //   Permission: transactions:delete
  //   Domain: organization-scoped
  rpc DeleteTransaction(DeleteTransactionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/transactions/*}"};
    option (google.api.method_signature) = "name";
  }
}
