syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "pixlcrashr/vsfv/v1/group.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// User represents a human actor that can log in via SSO.
// Users are created exclusively through the SSO/OAuth2 flow; this service
// exposes a read-only view for administration purposes.
message User {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/User"
    pattern: "users/{user}"
  };

  // The resource name of the user.
  // Format: users/{user}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the user.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // Primary display name (derived from SSO provider at last login).
  string display_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Primary e-mail address (derived from SSO provider at last login).
  string email = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the user account is active.
  bool is_active = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // URL of the user's profile picture (derived from SSO provider at last login).
  // Empty when the user has no picture.
  string picture_url = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp (first SSO login).
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ── Request / Response messages ──────────────────────────────────────────────

message GetUserRequest {
  // The resource name of the user.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/User"}
  ];
}

message ListUsersRequest {
  // Maximum number of users to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListUsers call.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: display_name, email, is_active.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "display_name", "create_time desc").
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListUsersResponse {
  // The users returned.
  repeated User users = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of users matching the filter (may be an estimate).
  int64 total_size = 3;
}

// ── Permission check ──────────────────────────────────────────────────────────

// CheckUserPermissionsRequest checks which of the requested permissions a
// user holds, optionally scoped to a domain.
// When domain is empty, permissions are evaluated against the global
// domain (e.g. users, groups, settings). When set, permissions are evaluated
// against the specified domain (e.g. "organizations/{organization}").
message CheckUserPermissionsRequest {
  // The resource name of the user.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/User"}
  ];

  // The domain to scope the check to (e.g. "organizations/{organization}").
  // If empty, permissions are checked against the global domain.
  string domain = 2 [(google.api.field_behavior) = OPTIONAL];

  // The permissions to evaluate, as "resource:action" strings.
  // At least one must be provided. Only the permissions listed here
  // are evaluated and returned.
  repeated string permissions = 3 [(google.api.field_behavior) = REQUIRED];
}

// CheckUserPermissionsResponse reports which of the requested permissions
// the user actually holds.
message CheckUserPermissionsResponse {
  // The domain that was evaluated, if any.
  // Empty if the check was global.
  string domain = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The subset of the requested permissions that the user holds.
  repeated string permitted = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// BatchCheckUserPermissionsRequest checks permissions for one or more users
// in a single call (AIP-231 batch pattern). Each entry can target a different
// domain (or the global domain when domain is empty).
message BatchCheckUserPermissionsRequest {
  // Individual check requests. Maximum 100 entries per call.
  repeated CheckUserPermissionsRequest requests = 1 [(google.api.field_behavior) = REQUIRED];
}

// BatchCheckUserPermissionsResponse returns one result entry per requested
// check, in the same order as the request.
message BatchCheckUserPermissionsResponse {
  // One result per entry in BatchCheckUserPermissionsRequest.requests,
  // in the same order.
  repeated CheckUserPermissionsResponse results = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListUserGroupsRequest requests the groups a user belongs to.
message ListUserGroupsRequest {
  // The resource name of the user.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/User"}
  ];
}

// ListUserGroupsResponse returns the groups a user belongs to.
message ListUserGroupsResponse {
  // The groups the user is a member of.
  repeated Group groups = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ── Service ───────────────────────────────────────────────────────────────────

// UserService provides a read-only administrative view of users.
// Users are created exclusively through the SSO/OAuth2 flow.
service UserService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single user by resource name.
  // Authorization:
  //   Scope: users:read
  //   Permission: users:read
  //   Domain: global
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/{name=users/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists users with pagination.
  // Authorization:
  //   Scope: users:read
  //   Permission: users:read
  //   Domain: global
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/users"};
  }

  // Checks which of the requested permissions a user holds, optionally scoped
  // to a domain (custom method, AIP-136).
  // When domain is empty, permissions are evaluated against the global
  // domain. When set, permissions are evaluated against the specified domain.
  // Authorization:
  //   Checking the calling user's own permissions:
  //     Requires authentication only (the SPA route guards call this on
  //     every navigation).
  //   Checking another user's permissions:
  //     Scope: users:read
  //     Permission: users:read
  //     Domain: global
  rpc CheckUserPermissions(CheckUserPermissionsRequest) returns (CheckUserPermissionsResponse) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:checkPermissions"
      body: "*"
    };
    option (google.api.method_signature) = "name,domain,permissions";
  }

  // Checks permissions for one or more users in one call, each optionally
  // scoped to a different domain (batch custom method, AIP-231).
  // Authorization:
  //   Checking the calling user's own permissions:
  //     Requires authentication only.
  //   Checking another user's permissions:
  //     Scope: users:read
  //     Permission: users:read
  //     Domain: global
  rpc BatchCheckUserPermissions(BatchCheckUserPermissionsRequest) returns (BatchCheckUserPermissionsResponse) {
    option (google.api.http) = {
      post: "/v1/users:batchCheckPermissions"
      body: "*"
    };
  }

  // Lists the groups a user belongs to (custom method, AIP-136).
  // Authorization:
  //   Scope: users:read
  //   Permission: users:read
  //   Domain: global
  rpc ListUserGroups(ListUserGroupsRequest) returns (ListUserGroupsResponse) {
    option (google.api.http) = {get: "/v1/{name=users/*}:listGroups"};
  }
}
