syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "pixlcrashr/vsfv/v1/decimal.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// BudgetAccountValue associates an account with a numeric target value within
// a budget. Accounts may optionally be assigned a value; not all accounts in
// the system need to be present.
message BudgetAccountValue {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/BudgetAccountValue"
    pattern: "organizations/{organization}/budgets/{budget}/accountValues/{account_value}"
  };

  // The resource name of the budget account value.
  // Format: organizations/{organization}/budgets/{budget}/accountValues/{account_value}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the budget account value.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // The resource name of the parent budget.
  // Format: organizations/{organization}/budgets/{budget}
  string budget = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];

  // Resource name of the account this value is assigned to.
  // Format: organizations/{organization}/accounts/{account}
  string account = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Account"}
  ];

  // The target monetary value assigned to the account for this budget.
  Decimal value = 5 [(google.api.field_behavior) = REQUIRED];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetBudgetAccountValueRequest {
  // The resource name of the budget account value.
  // Format: organizations/{organization}/budgets/{budget}/accountValues/{account_value}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/BudgetAccountValue"}
  ];
}

message ListBudgetAccountValuesRequest {
  // The parent budget resource name. Two forms are accepted:
  //  - A single budget: organizations/{organization}/budgets/{budget}
  //  - The wildcard form organizations/{organization}/budgets/- to list the
  //    account values of every budget of the organization in one request;
  //    the budgets can be selected via the `budget` filter field.
  // The dash "-" is the only wildcard marker; "*" is not supported.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];

  // Maximum number of values to return. The service may return fewer.
  // If unspecified, at most 100 are returned. Maximum value is 500.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListBudgetAccountValues call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields:
  //   - account: the account resource name (e.g.
  //              "organizations/{organization}/accounts/{account}").
  //   - budget:  the budget resource name. Only accepted when the budget
  //              segment of the parent is the wildcard "-", e.g.:
  //              budget="..." OR budget="...".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "create_time desc").
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListBudgetAccountValuesResponse {
  // The budget account values returned.
  repeated BudgetAccountValue account_values = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of account values matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateBudgetAccountValueRequest {
  // The parent budget resource name.
  // Format: organizations/{organization}/budgets/{budget}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];

  // The budget account value to create.
  BudgetAccountValue account_value = 2 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the budget account value. If not provided, a
  // system-generated UUID will be used. Must be unique within the parent budget.
  string budget_account_value_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateBudgetAccountValueRequest {
  // The budget account value to update.
  BudgetAccountValue account_value = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // If set to true, and the resource is not found, a new resource will be
  // created. In this situation, update_mask is ignored.
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteBudgetAccountValueRequest {
  // The resource name of the budget account value.
  // Format: organizations/{organization}/budgets/{budget}/accountValues/{account_value}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/BudgetAccountValue"}
  ];
}

message BatchUpdateBudgetAccountValuesRequest {
  // The parent resource shared by all budget account values being updated.
  // Format: organizations/{organization}/budgets/{budget}
  // If set, the parent field in each UpdateBudgetAccountValueRequest must
  // either be empty or match this field.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "vsfv.pixlcrashr.dev/BudgetAccountValue"}
  ];

  // The request messages specifying the resources to update.
  // A maximum of 1000 budget account values can be modified in a batch.
  repeated UpdateBudgetAccountValueRequest requests = 2 [(google.api.field_behavior) = REQUIRED];
}

message BatchUpdateBudgetAccountValuesResponse {
  // The budget account values that were updated.
  repeated BudgetAccountValue account_values = 1;
}

// BudgetAccountValueService manages per-account value assignments within a budget.
service BudgetAccountValueService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single budget account value by resource name.
  // Authorization:
  //   Scope: budgets:read
  //   Permission: budgets:read
  //   Domain: organization-scoped
  rpc GetBudgetAccountValue(GetBudgetAccountValueRequest) returns (BudgetAccountValue) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/budgets/*/accountValues/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists account values for a budget. The wildcard parent form
  // (organizations/{organization}/budgets/-) lists the values of every
  // budget of the organization in a single request, optionally restricted
  // via the `budget` filter.
  // Authorization:
  //   Scope: budgets:read
  //   Permission: budgets:read
  //   Domain: organization-scoped
  rpc ListBudgetAccountValues(ListBudgetAccountValuesRequest) returns (ListBudgetAccountValuesResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/budgets/*}/accountValues"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a new budget account value.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:create
  //   Domain: organization-scoped
  rpc CreateBudgetAccountValue(CreateBudgetAccountValueRequest) returns (BudgetAccountValue) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/budgets/*}/accountValues"
      body: "account_value"
    };
    option (google.api.method_signature) = "parent,account_value,budget_account_value_id";
  }

  // Updates an existing budget account value.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:update
  //   Domain: organization-scoped
  rpc UpdateBudgetAccountValue(UpdateBudgetAccountValueRequest) returns (BudgetAccountValue) {
    option (google.api.http) = {
      patch: "/v1/{account_value.name=organizations/*/budgets/*/accountValues/*}"
      body: "account_value"
    };
    option (google.api.method_signature) = "account_value,update_mask";
  }

  // Permanently deletes a budget account value.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:delete
  //   Domain: organization-scoped
  rpc DeleteBudgetAccountValue(DeleteBudgetAccountValueRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/budgets/*/accountValues/*}"};
    option (google.api.method_signature) = "name";
  }

  // Atomically upserts multiple account values for a budget.
  // Existing values for listed account IDs are updated; missing ones are created.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:update
  //   Domain: organization-scoped
  rpc BatchUpdateBudgetAccountValues(BatchUpdateBudgetAccountValuesRequest) returns (BatchUpdateBudgetAccountValuesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/budgets/*}/accountValues:batchUpdate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,entries";
  }
}
