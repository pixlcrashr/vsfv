syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// Group is a named collection of users that share a common set of permissions.
// Permissions are self-standing (not scoped per organization); instead,
// groups are assigned to organizations via the organizations field.
message Group {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/Group"
    pattern: "groups/{group}"
  };

  // The resource name of the group.
  // Format: groups/{group}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the group.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // Human-readable group name.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional free-text description.
  string display_description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Organizations this group is assigned to (resource names).
  // Format: organizations/{organization}
  repeated string organizations = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // Self-standing permissions granted to this group.
  // Format: "resource:action" (e.g. "accounts:read", "users:update").
  repeated string permissions = 9 [(google.api.field_behavior) = OPTIONAL];

  // Whether this is a system group. System groups are managed by the
  // application and cannot be modified or deleted.
  bool is_system = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ── Request / Response messages ──────────────────────────────────────────────

message GetGroupRequest {
  // The resource name of the group.
  // Format: groups/{group}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Group"}
  ];
}

message ListGroupsRequest {
  // Maximum number of groups to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListGroups call.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: display_name.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "display_name", "create_time desc").
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListGroupsResponse {
  // The groups returned.
  repeated Group groups = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of groups matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateGroupRequest {
  // The group to create.
  Group group = 1 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the group. If not provided, a system-generated UUID
  // will be used. Must be unique across all groups.
  string group_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateGroupRequest {
  // The group to update.
  Group group = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteGroupRequest {
  // The resource name of the group.
  // Format: groups/{group}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Group"}
  ];
}

// ── User-Group membership ─────────────────────────────────────────────────────

message AddUserToGroupRequest {
  // The resource name of the group.
  // Format: groups/{group}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Group"}
  ];

  // The resource name of the user to add.
  // Format: users/{user}
  string user = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/User"}
  ];
}

message RemoveUserFromGroupRequest {
  // The resource name of the group.
  // Format: groups/{group}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Group"}
  ];

  // The resource name of the user to remove.
  // Format: users/{user}
  string user = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/User"}
  ];
}

// ── Service ───────────────────────────────────────────────────────────────────

// GroupService manages groups and their per-organization permission policies.
service GroupService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single group by resource name.
  // Authorization:
  //   Scope: groups:read
  //   Permission: groups:read
  //   Domain: global
  rpc GetGroup(GetGroupRequest) returns (Group) {
    option (google.api.http) = {get: "/v1/{name=groups/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists groups with pagination.
  // Authorization:
  //   Scope: groups:read
  //   Permission: groups:read
  //   Domain: global
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (google.api.http) = {get: "/v1/groups"};
  }

  // Creates a new group.
  // Authorization:
  //   Scope: groups:write
  //   Permission: groups:create
  //   Domain: global
  rpc CreateGroup(CreateGroupRequest) returns (Group) {
    option (google.api.http) = {
      post: "/v1/groups"
      body: "group"
    };
    option (google.api.method_signature) = "group,group_id";
  }

  // Updates an existing group.
  // Authorization:
  //   Scope: groups:write
  //   Permission: groups:update
  //   Domain: global
  rpc UpdateGroup(UpdateGroupRequest) returns (Group) {
    option (google.api.http) = {
      patch: "/v1/{group.name=groups/*}"
      body: "group"
    };
    option (google.api.method_signature) = "group,update_mask";
  }

  // Permanently deletes a group.
  // Authorization:
  //   Scope: groups:write
  //   Permission: groups:delete
  //   Domain: global
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=groups/*}"};
    option (google.api.method_signature) = "name";
  }

  // Adds a user to a group (custom method, AIP-136).
  // Authorization:
  //   Scope: groups:write
  //   Permission: groups:update
  //   Domain: global
  rpc AddUserToGroup(AddUserToGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=groups/*}:addUser"
      body: "*"
    };
  }

  // Removes a user from a group (custom method, AIP-136).
  // Authorization:
  //   Scope: groups:write
  //   Permission: groups:update
  //   Domain: global
  rpc RemoveUserFromGroup(RemoveUserFromGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=groups/*}:removeUser"
      body: "*"
    };
  }
}
