syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// Account represents a budget account in the chart of accounts.
message Account {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/Account"
    pattern: "organizations/{organization}/accounts/{account}"
  };

  // The resource name of the account.
  // Format: organizations/{organization}/accounts/{account}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the account.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // The resource name of the parent account, if any.
  // Format: organizations/{organization}/accounts/{account}
  string parent_account = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Account"}
  ];

  // Human-readable account name.
  string display_name = 4 [(google.api.field_behavior) = REQUIRED];

  // Short account code.
  string display_code = 5 [(google.api.field_behavior) = REQUIRED];

  // The full account code: the account's display_code concatenated with the
  // display_code of each ancestor, separated by "-", ordered from the root
  // ancestor down to the account itself. Example: "A-1-2-3-4".
  string display_full_code = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The full account name: the account's display_name concatenated with the
  // display_name of each ancestor, separated by " / ", ordered from the root
  // ancestor down to the account itself. Example: "Root / Child / Grandchild".
  string display_full_name = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional free-text description.
  string display_description = 6 [(google.api.field_behavior) = OPTIONAL];

  // Whether this account is a container account (cannot hold values directly).
  // Immutable after creation.
  bool is_container = 7 [(google.api.field_behavior) = IMMUTABLE];

  // Whether the account is archived (soft-deleted).
  bool is_archived = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// NestedAccount is a read-only view of an Account that includes its full
// subtree of child accounts. It shares the same resource name as Account.
message NestedAccount {
  // The resource name of the parent account, if any.
  // Format: organizations/{organization}/accounts/{account}
  string parent_account = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Account"}
  ];

  Account account = 1;

  // Child accounts in the subtree.
  repeated NestedAccount children = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetAccountRequest {
  // The resource name of the account.
  // Format: organizations/{organization}/accounts/{account}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Account"}
  ];
}

message ListAccountsRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // Maximum number of accounts to return. The service may return fewer.
  // If unspecified, at most 20 accounts will be returned. Maximum value is 100;
  // values above 100 will be coerced to 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListAccounts call.
  // Provide this to retrieve the next page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: display_name, display_code, is_archived.
  // Example: "is_archived=true" or "display_name:foo".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // If true, soft-deleted (archived) accounts are included in results.
  // See AIP-132 for soft-delete guidance.
  bool show_deleted = 5 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "display_name", "create_time desc").
  string order_by = 6 [(google.api.field_behavior) = OPTIONAL];
}

message ListAccountsResponse {
  // The accounts returned.
  repeated Account accounts = 1;

  // A token to retrieve the next page of results.
  // Pass this value in ListAccountsRequest.page_token on the next call.
  string next_page_token = 2;

  // Total number of accounts matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateAccountRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // The account to create.
  Account account = 2 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the account. If not provided, a system-generated UUID
  // will be used. Must be unique within the parent organization.
  string account_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateAccountRequest {
  // The account to update.
  Account account = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ArchiveAccountRequest {
  // The resource name of the account.
  // Format: organizations/{organization}/accounts/{account}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Account"}
  ];
}

message RestoreAccountRequest {
  // The resource name of the account.
  // Format: organizations/{organization}/accounts/{account}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Account"}
  ];
}

// Request for the ListNestedAccounts custom method.
message ListNestedAccountsRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // Filter expression conforming to AIP-160.
  // Supported fields: is_archived.
  // Example: "is_archived=true".
  string filter = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response for the ListNestedAccounts custom method.
message ListNestedAccountsResponse {
  // Root-level accounts, each carrying their full nested subtree.
  repeated NestedAccount accounts = 1;
}

// Request for the GetNestedAccount custom method.
message GetNestedAccountRequest {
  // The resource name of the root account for the subtree.
  // Format: organizations/{organization}/accounts/{account}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Account"}
  ];

  // Filter expression applied to all descendants in the subtree.
  // Supported fields: is_archived.
  // Example: "is_archived=false".
  string filter = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response for the GetNestedAccount custom method.
message GetNestedAccountResponse {
  // The requested account with its full nested subtree.
  NestedAccount account = 1;
}

// AccountService manages budget accounts in the chart of accounts.
service AccountService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single account by resource name.
  // Authorization:
  //   Scope: accounts:read
  //   Permission: accounts:read
  //   Domain: organization-scoped
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/accounts/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists accounts with pagination.
  // Authorization:
  //   Scope: accounts:read
  //   Permission: accounts:read
  //   Domain: organization-scoped
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/accounts"};
    option (google.api.method_signature) = "parent";
  }

  // Lists all root accounts with their full nested subtrees (custom method).
  // Authorization:
  //   Scope: accounts:read
  //   Permission: accounts:read
  //   Domain: organization-scoped
  rpc ListNestedAccounts(ListNestedAccountsRequest) returns (ListNestedAccountsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/accounts:listNested"};
    option (google.api.method_signature) = "parent";
  }

  // Gets a single account's full nested subtree (custom method).
  // Authorization:
  //   Scope: accounts:read
  //   Permission: accounts:read
  //   Domain: organization-scoped
  rpc GetNestedAccount(GetNestedAccountRequest) returns (GetNestedAccountResponse) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/accounts/*}:getNested"};
    option (google.api.method_signature) = "name";
  }

  // Creates a new account.
  // Authorization:
  //   Scope: accounts:write
  //   Permission: accounts:create
  //   Domain: organization-scoped
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/accounts"
      body: "account"
    };
    option (google.api.method_signature) = "parent,account,account_id";
  }

  // Updates an existing account.
  // Authorization:
  //   Scope: accounts:write
  //   Permission: accounts:update
  //   Domain: organization-scoped
  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = {
      patch: "/v1/{account.name=organizations/*/accounts/*}"
      body: "account"
    };
    option (google.api.method_signature) = "account,update_mask";
  }

  // Archives an account (soft-delete).
  // Authorization:
  //   Scope: accounts:write
  //   Permission: accounts:archive
  //   Domain: organization-scoped
  rpc ArchiveAccount(ArchiveAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/accounts/*}:archive"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Restores an archived account (undo of ArchiveAccount).
  // Authorization:
  //   Scope: accounts:write
  //   Permission: accounts:restore
  //   Domain: organization-scoped
  rpc RestoreAccount(RestoreAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/accounts/*}:restore"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
