syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "pixlcrashr/vsfv/v1/committee.proto";
import "pixlcrashr/vsfv/v1/common.proto";
import "pixlcrashr/vsfv/v1/decimal.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// Scope describes whether a submission relates to nonprofit ("hoheitlich")
// or commercial ("gewerblich") activity.
enum SubmissionScope {
  SUBMISSION_SCOPE_UNSPECIFIED = 0;
  SUBMISSION_SCOPE_NONE = 1;
  SUBMISSION_SCOPE_NONPROFIT = 2;
  SUBMISSION_SCOPE_COMMERCIAL = 3;
}

// SubmissionStatus is the lifecycle state of a submission.
// DRAFT → PENDING → (FURTHER_INFO_REQUIRED → PENDING) → APPROVED → COMPLETED,
// or REJECTED. Expenses settled via SETTLEMENT_COMMITTEE_ACCOUNT and income
// submissions are COMPLETED directly upon approval.
enum SubmissionStatus {
  SUBMISSION_STATUS_UNSPECIFIED = 0;
  SUBMISSION_STATUS_DRAFT = 1;
  SUBMISSION_STATUS_PENDING = 2;
  SUBMISSION_STATUS_FURTHER_INFO_REQUIRED = 3;
  SUBMISSION_STATUS_REJECTED = 4;
  SUBMISSION_STATUS_APPROVED = 5;
  SUBMISSION_STATUS_COMPLETED = 6;
}

message SubmissionPayoutMethodBankTransfer {
  // The bank account for the payout (required for bank transfer payouts).
  BankAccount bank_account = 2 [(google.api.field_behavior) = OPTIONAL];
}

message SubmissionPayoutMethodCash {}

// SubmissionSettlementPerson are the settlement details for a person settlement.
message SubmissionSettlementPerson {
  oneof payout_method {
    SubmissionPayoutMethodBankTransfer bank_transfer = 1;
    SubmissionPayoutMethodCash cash = 2;
  }
}

// SubmissionSettlementCommitteeAccount are the settlement details for an expense that was
// already paid from a committee-held payment account.
message SubmissionSettlementCommitteeAccount {
  // The resource name of the committee payment account the expense was paid from
  string payment_account = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/CommitteePaymentAccount"}
  ];

  // The date the expense was paid.
  google.type.Date paid_date = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional payment reference (e.g. mandate or booking reference).
  string payment_reference = 3 [(google.api.field_behavior) = OPTIONAL];
}

// SubmissionSettlementPaymentRequest are the settlement details for an expense that the
// treasury should pay from the central account.
message SubmissionSettlementPaymentRequest {
  BankAccount bank_account = 1 [(google.api.field_behavior) = REQUIRED];
}

message SubmissionDirectionIncomeDetails {}

message SubmissionDirectionExpenseDetails {
  oneof settlement {
    // Details for a person settlement.
    SubmissionSettlementPerson person = 12;
    // Details for an already-paid committee account settlement.
    SubmissionSettlementCommitteeAccount committee_account = 13;
    // Details for a payment request to the treasury.
    SubmissionSettlementPaymentRequest payment_request = 14;
  }
}

message SubmissionTypeIncomeExpenseDetails {
  SubmissionScope scope = 1 [(google.api.field_behavior) = REQUIRED];

  oneof direction {
    SubmissionDirectionIncomeDetails income = 2;
    SubmissionDirectionExpenseDetails expense = 3;
  }
}

message SubmissionTypeMiscDetails {}

// Submission is a documented expense or income or misc documents with receipts, submitted by a
// committee member and reviewed by the treasury.
message Submission {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/Submission"
    pattern: "organizations/{organization}/submissions/{submission}"
  };

  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the submission.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // Human-readable public ID (per-organization yearly sequence, e.g. "2026/04").
  string public_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The user that created the submission.
  // Format: users/{user}
  string created_by_user = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/User"}
  ];

  // The committee the submission belongs to.
  // Format: organizations/{organization}/committees/{committee}
  string committee = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Committee"}
  ];

  oneof type {
    SubmissionTypeIncomeExpenseDetails income_expense = 6;
    SubmissionTypeMiscDetails misc = 7;
  }

  // The lifecycle state of the submission.
  SubmissionStatus status = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Free-text notice from the submitter.
  string notice = 9 [(google.api.field_behavior) = OPTIONAL];

  // Sum of all item amounts (read-only derived value).
  Decimal total_amount = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time the submission was soft-deleted, if deleted.
  google.protobuf.Timestamp delete_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time at which the soft-deleted submission is purged automatically.
  google.protobuf.Timestamp purge_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp
  google.protobuf.Timestamp create_time = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetSubmissionRequest {
  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Submission"}
  ];
}

message ListSubmissionsRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // Maximum number of submissions to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListSubmissions call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: direction, settlement, status, committee, created_by_user.
  // Example: "committee=\"organizations/{organization}/committees/{committee}\" AND status=\"PENDING\"".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "create_time desc").
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Whether to include soft-deleted submissions in the result.
  bool show_deleted = 6 [(google.api.field_behavior) = OPTIONAL];
}

message ListSubmissionsResponse {
  // The submissions returned.
  repeated Submission submissions = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of submissions matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateSubmissionRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // The submission to create. Submissions are always created in the DRAFT
  // state, so the request may omit fields that are still unknown; all fields
  // are validated on submit.
  Submission submission = 2 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the submission. If not provided, a system-generated
  // UUID will be used. Must be unique within the parent organization.
  string submission_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateSubmissionRequest {
  // The submission to update.
  Submission submission = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update. The `status`, `created_by_user` and
  // read-only fields cannot be updated. Updating `scope` requires the
  // treasury update permission (submitters cannot change the scope after
  // creation).
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteSubmissionRequest {
  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Submission"}
  ];
}

message SubmitSubmissionRequest {
  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Submission"}
  ];
}

message ApproveSubmissionRequest {
  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Submission"}
  ];

  // Optional note recorded with the approval.
  string note = 2 [(google.api.field_behavior) = OPTIONAL];
}

message RejectSubmissionRequest {
  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Submission"}
  ];

  // The reason for the rejection; recorded as a comment.
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

message RequestFurtherInfoRequest {
  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Submission"}
  ];

  // What information is required; recorded as a comment.
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

message CompleteSubmissionRequest {
  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Submission"}
  ];

  // The date the payout/payment was executed (if already known).
  google.type.Date paid_date = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional payment reference recorded with the completion.
  string payment_reference = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UndeleteSubmissionRequest {
  // The resource name of the submission.
  // Format: organizations/{organization}/submissions/{submission}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Submission"}
  ];
}

// SubmissionService manages submissions (expense claims and income documents).
service SubmissionService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single submission by resource name.
  // Authorization:
  //   Scope: submissions:read
  //   Permission: submissions:read or submissions:read_own
  //   Domain: organization-scoped
  rpc GetSubmission(GetSubmissionRequest) returns (Submission) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/submissions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists submissions with pagination and optional filters. Drafts are only
  // included when explicitly filtered by status.
  // Authorization:
  //   Scope: submissions:read
  //   Permission: submissions:read or submissions:read_own
  //   Domain: organization-scoped
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/submissions"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a new submission in the DRAFT state.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:create
  //   Domain: organization-scoped
  rpc CreateSubmission(CreateSubmissionRequest) returns (Submission) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/submissions"
      body: "submission"
    };
    option (google.api.method_signature) = "parent,submission,submission_id";
  }

  // Updates an existing submission. Only allowed while the submission is in
  // DRAFT, PENDING or FURTHER_INFO_REQUIRED state, and only by the submitter
  // or the treasury. Updating the scope requires the treasury update
  // permission.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:update or submissions:update_own
  //   Domain: organization-scoped
  rpc UpdateSubmission(UpdateSubmissionRequest) returns (Submission) {
    option (google.api.http) = {
      patch: "/v1/{submission.name=organizations/*/submissions/*}"
      body: "submission"
    };
    option (google.api.method_signature) = "submission,update_mask";
  }

  // Soft-deletes a submission. The submission is purged automatically after
  // the retention period.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:delete or submissions:update_own
  //   Domain: organization-scoped
  rpc DeleteSubmission(DeleteSubmissionRequest) returns (Submission) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/submissions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Submits a draft for review (DRAFT → PENDING). Validates that the
  // submission is complete.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:update or submissions:update_own
  //   Domain: organization-scoped
  rpc SubmitSubmission(SubmitSubmissionRequest) returns (Submission) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/submissions/*}:submit"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Approves a submission (PENDING/FURTHER_INFO_REQUIRED → APPROVED, or →
  // COMPLETED for committee-account settlements and income submissions).
  // Treasury only.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:update
  //   Domain: organization-scoped
  rpc ApproveSubmission(ApproveSubmissionRequest) returns (Submission) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/submissions/*}:approve"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Rejects a submission (→ REJECTED) and records the reason as a comment.
  // Treasury only.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:update
  //   Domain: organization-scoped
  rpc RejectSubmission(RejectSubmissionRequest) returns (Submission) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/submissions/*}:reject"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Requests further information (PENDING → FURTHER_INFO_REQUIRED) and
  // records the reason as a comment. Treasury only.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:update
  //   Domain: organization-scoped
  rpc RequestFurtherInfo(RequestFurtherInfoRequest) returns (Submission) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/submissions/*}:requestFurtherInfo"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Completes an approved submission (APPROVED → COMPLETED), optionally
  // recording the execution date and payment reference. Treasury only.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:update
  //   Domain: organization-scoped
  rpc CompleteSubmission(CompleteSubmissionRequest) returns (Submission) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/submissions/*}:complete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Restores a soft-deleted submission.
  // Authorization:
  //   Scope: submissions:write
  //   Permission: submissions:delete
  //   Domain: organization-scoped
  rpc UndeleteSubmission(UndeleteSubmissionRequest) returns (Submission) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/submissions/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
