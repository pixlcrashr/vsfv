syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// PaymentAccountKind describes the kind of payment account held by a committee.
enum PaymentAccountKind {
  PAYMENT_ACCOUNT_KIND_UNSPECIFIED = 0;
  PAYMENT_ACCOUNT_KIND_BANK_ACCOUNT = 1;
  PAYMENT_ACCOUNT_KIND_CASH_BOX = 2;
}

// CommitteePaymentAccount describes a payment account held by a committee
// (e.g. the committee's own bank account or an independently organized cash
// box). Committees with at least one payment account may pay expenses from
// these accounts and submit the bills for documentation.
message CommitteePaymentAccount {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/CommitteePaymentAccount"
    pattern: "organizations/{organization}/committees/{committee}/paymentAccounts/{payment_account}"
  };

  // The resource name of the payment account.
  // Format: organizations/{organization}/committees/{committee}/paymentAccounts/{payment_account}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the payment account. Used by submissions to reference the
  // account they were paid from.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // The resource name of the parent committee.
  // Format: organizations/{organization}/committees/{committee}
  string committee = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Committee"}
  ];

  // The kind of payment account.
  PaymentAccountKind kind = 4 [(google.api.field_behavior) = REQUIRED];

  // Human-readable label of the payment account (e.g. "Gremiumskonto").
  string display_label = 5 [(google.api.field_behavior) = REQUIRED];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetCommitteePaymentAccountRequest {
  // The resource name of the payment account.
  // Format: organizations/{organization}/committees/{committee}/paymentAccounts/{payment_account}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/CommitteePaymentAccount"}
  ];
}

message ListCommitteePaymentAccountsRequest {
  // The parent committee resource name.
  // Format: organizations/{organization}/committees/{committee}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Committee"}
  ];

  // Maximum number of payment accounts to return. The service may return
  // fewer. If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListCommitteePaymentAccounts call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListCommitteePaymentAccountsResponse {
  // The payment accounts returned.
  repeated CommitteePaymentAccount payment_accounts = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of payment accounts of the committee (may be an estimate).
  int64 total_size = 3;
}

message CreateCommitteePaymentAccountRequest {
  // The parent committee resource name.
  // Format: organizations/{organization}/committees/{committee}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Committee"}
  ];

  // The payment account to create.
  CommitteePaymentAccount payment_account = 2 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the payment account. If not provided, a system-generated
  // UUID will be used. Must be unique within the parent committee.
  string payment_account_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateCommitteePaymentAccountRequest {
  // The payment account to update.
  CommitteePaymentAccount payment_account = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteCommitteePaymentAccountRequest {
  // The resource name of the payment account.
  // Format: organizations/{organization}/committees/{committee}/paymentAccounts/{payment_account}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/CommitteePaymentAccount"}
  ];
}

// CommitteePaymentAccountService manages the payment accounts held by a
// committee.
service CommitteePaymentAccountService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single payment account by resource name.
  // Authorization:
  //   Scope: committees:read
  //   Permission: committees:read
  //   Domain: organization-scoped
  rpc GetCommitteePaymentAccount(GetCommitteePaymentAccountRequest) returns (CommitteePaymentAccount) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/committees/*/paymentAccounts/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the payment accounts of a committee.
  // Authorization:
  //   Scope: committees:read
  //   Permission: committees:read
  //   Domain: organization-scoped
  rpc ListCommitteePaymentAccounts(ListCommitteePaymentAccountsRequest) returns (ListCommitteePaymentAccountsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/committees/*}/paymentAccounts"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a payment account held by a committee.
  // Authorization:
  //   Scope: committees:write
  //   Permission: committees:update
  //   Domain: organization-scoped
  rpc CreateCommitteePaymentAccount(CreateCommitteePaymentAccountRequest) returns (CommitteePaymentAccount) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/committees/*}/paymentAccounts"
      body: "payment_account"
    };
    option (google.api.method_signature) = "parent,payment_account,payment_account_id";
  }

  // Updates an existing payment account.
  // Authorization:
  //   Scope: committees:write
  //   Permission: committees:update
  //   Domain: organization-scoped
  rpc UpdateCommitteePaymentAccount(UpdateCommitteePaymentAccountRequest) returns (CommitteePaymentAccount) {
    option (google.api.http) = {
      patch: "/v1/{payment_account.name=organizations/*/committees/*/paymentAccounts/*}"
      body: "payment_account"
    };
    option (google.api.method_signature) = "payment_account,update_mask";
  }

  // Deletes a payment account. Submissions that reference the account keep
  // their stored label snapshot.
  // Authorization:
  //   Scope: committees:write
  //   Permission: committees:update
  //   Domain: organization-scoped
  rpc DeleteCommitteePaymentAccount(DeleteCommitteePaymentAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/committees/*/paymentAccounts/*}"};
    option (google.api.method_signature) = "name";
  }
}
