syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// Budget represents a financial budget with a defined period.
message Budget {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/Budget"
    pattern: "organizations/{organization}/budgets/{budget}"
  };

  // The resource name of the budget.
  // Format: organizations/{organization}/budgets/{budget}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the budget.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // Human-readable budget name.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional free-text description.
  string display_description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Whether the budget is closed (no further modifications allowed).
  bool is_closed = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Budget period start date. Immutable after creation.
  google.type.Date period_start = 6 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Budget period end date. Immutable after creation.
  google.type.Date period_end = 7 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the budget is published. Only published budgets allow their
  // revisions to be published.
  bool is_published = 11 [(google.api.field_behavior) = OPTIONAL];

  // Whether current actual (Ist) account values are publicly visible.
  bool publish_actual_values = 12 [(google.api.field_behavior) = OPTIONAL];

  // Optional date until which current actual values are publicly visible.
  // Must lie within the budget period. If unset, the end of the budget period
  // is assumed.
  google.type.Date publish_actual_values_until = 13 [(google.api.field_behavior) = OPTIONAL];

  // Position of the budget in the organization's custom ordering. A lower
  // value means a higher position; the first budget has the lowest value.
  // Assigned automatically; modified only via ReorderBudgets.
  int32 order = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetBudgetRequest {
  // The resource name of the budget.
  // Format: organizations/{organization}/budgets/{budget}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];
}

message ListBudgetsRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // Maximum number of budgets to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListBudgets call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: display_name, is_closed.
  // Example: "is_closed=false" or "display_name=\"FY2025\"".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // If true, closed budgets are included in results.
  bool show_deleted = 5 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "display_name", "period_start desc").
  // If unspecified, budgets are returned in their custom order.
  string order_by = 6 [(google.api.field_behavior) = OPTIONAL];
}

message ListBudgetsResponse {
  // The budgets returned.
  repeated Budget budgets = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of budgets matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateBudgetRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // The budget to create.
  Budget budget = 2 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the budget. If not provided, a system-generated UUID
  // will be used. Must be unique within the parent organization.
  string budget_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateBudgetRequest {
  // The budget to update.
  Budget budget = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteBudgetRequest {
  // The resource name of the budget.
  // Format: organizations/{organization}/budgets/{budget}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];
}

message CloseBudgetRequest {
  // The resource name of the budget to close.
  // Format: organizations/{organization}/budgets/{budget}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];
}

message ReorderBudgetsRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // The budget resource names in their desired order, from first (top of
  // lists) to last (bottom of lists). Must contain every budget of the
  // organization exactly once.
  repeated string budgets = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];
}

// BudgetService manages financial budgets.
service BudgetService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single budget by resource name.
  // Authorization:
  //   Scope: budgets:read
  //   Permission: budgets:read
  //   Domain: organization-scoped
  rpc GetBudget(GetBudgetRequest) returns (Budget) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/budgets/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists budgets with pagination.
  // Authorization:
  //   Scope: budgets:read
  //   Permission: budgets:read
  //   Domain: organization-scoped
  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/budgets"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a new budget.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:create
  //   Domain: organization-scoped
  rpc CreateBudget(CreateBudgetRequest) returns (Budget) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/budgets"
      body: "budget"
    };
    option (google.api.method_signature) = "parent,budget,budget_id";
  }

  // Updates an existing budget.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:update
  //   Domain: organization-scoped
  rpc UpdateBudget(UpdateBudgetRequest) returns (Budget) {
    option (google.api.http) = {
      patch: "/v1/{budget.name=organizations/*/budgets/*}"
      body: "budget"
    };
    option (google.api.method_signature) = "budget,update_mask";
  }

  // Closes a budget, marking it as no longer active.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:close
  //   Domain: organization-scoped
  rpc CloseBudget(CloseBudgetRequest) returns (Budget) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/budgets/*}:close"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Reorders the budgets of an organization. The custom order determines the
  // position of budgets in lists: the first budget in the request is listed
  // first, the last one last. Newly created budgets are appended at the end.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:update
  //   Domain: organization-scoped
  rpc ReorderBudgets(ReorderBudgetsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/budgets:reorder"
      body: "*"
    };
    option (google.api.method_signature) = "parent,budgets";
  }

  // Permanently deletes a budget.
  // Authorization:
  //   Scope: budgets:write
  //   Permission: budgets:delete
  //   Domain: organization-scoped
  rpc DeleteBudget(DeleteBudgetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/budgets/*}"};
    option (google.api.method_signature) = "name";
  }
}
