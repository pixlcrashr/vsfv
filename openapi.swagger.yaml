            $ref: '#/definitions/v1ReportTemplate'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: report_template.name
          description: |-
            The resource name of the report template.
            Format: organizations/{organization}/reportTemplates/{report_template}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/reportTemplates/[^/]+
        - name: report_template
          description: The report template to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the report template.
                readOnly: true
              display_name:
                type: string
                description: Human-readable name.
              template:
                type: string
                description: The Handlebars template content.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The report template to update.
            required:
              - display_name
              - template
      tags:
        - ReportTemplateService
  /v1/{revision.name}:
    patch:
      summary: |-
        Updates a revision. Only the is_published field may be updated.
        Setting is_published to true requires the parent budget to be published.
        Authorization:
          Scope: budgets:write
          Permission: budgets:update
          Domain: organization-scoped
      operationId: BudgetRevisionService_UpdateBudgetRevision
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1BudgetRevision'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: revision.name
          description: |-
            The resource name of the revision.
            Format: organizations/{organization}/budgets/{budget}/revisions/{revision}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/budgets/[^/]+/revisions/[^/]+
        - name: revision
          description: |-
            The revision to update. Only is_published can be changed; all other
            fields are immutable after creation.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the revision.
                readOnly: true
              budget:
                type: string
                title: |-
                  The resource name of the parent budget.
                  Format: organizations/{organization}/budgets/{budget}
                readOnly: true
              display_name:
                type: string
                description: Human-readable name for this revision.
              display_description:
                type: string
                description: Optional free-text description for this revision.
              date:
                $ref: '#/definitions/typeDate'
                description: The date this revision represents.
              create_time:
                type: string
                format: date-time
                description: Timestamp when this revision was created.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
              is_published:
                type: boolean
                description: |-
                  Whether the revision is published. A revision can only be published if
                  its parent budget is published.
            description: |-
              The revision to update. Only is_published can be changed; all other
              fields are immutable after creation.
            required:
              - display_name
      tags:
        - BudgetRevisionService
  /v1/{settings.name}:
    patch:
      summary: |-
        Updates the settings for a user.
        Authorization:
          Scope: settings:write
          Permission: settings:update
          Domain: global
      operationId: UserSettingsService_UpdateUserSettings
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UserSettings'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: settings.name
          description: |-
            The resource name of the user settings.
            Format: users/{user}/settings
          in: path
          required: true
          type: string
          pattern: users/[^/]+/settings
        - name: settings
          description: The user settings to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              locale:
                type: string
                description: Preferred locale/language tag (e.g. "de-DE").
              theme:
                type: string
                description: 'Preferred UI theme: "light", "dark", or "system".'
              email_notifications:
                type: boolean
                description: Whether the user wants to receive email notifications.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The user settings to update.
        - name: allow_missing
          description: |-
            If true and the resource does not exist, a new resource will be created.
            In this case, the field mask is ignored.
            https://google.aip.dev/134#create-or-update
          in: query
          required: false
          type: boolean
      tags:
        - UserSettingsService
  /v1/{transaction.name}:
    patch:
      summary: |-
        Updates an existing transaction.
        Authorization:
          Scope: transactions:write
          Permission: transactions:update
          Domain: organization-scoped
      operationId: TransactionService_UpdateTransaction
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Transaction'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: transaction.name
          description: |-
            The resource name of the transaction.
            Format: organizations/{organization}/transactions/{transaction}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/transactions/[^/]+
        - name: transaction
          description: The transaction to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the transaction.
                readOnly: true
              credit_ledger_account:
                type: string
                title: |-
                  Resource name of the credit ledger account.
                  Format: organizations/{organization}/ledgerAccounts/{ledger_account}
              debit_ledger_account:
                type: string
                title: |-
                  Resource name of the debit ledger account.
                  Format: organizations/{organization}/ledgerAccounts/{ledger_account}
              amount:
                $ref: '#/definitions/v1Decimal'
                description: Transaction amount.
              description:
                type: string
                description: Human-readable transaction description.
              reference:
                type: string
                description: External reference identifier.
              booked_at:
                type: string
                format: date-time
                description: Booking date.
              document_date:
                type: string
                format: date-time
                description: Document date.
              document_id:
                type: string
                description: Optional document ID.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The transaction to update.
            required:
              - credit_ledger_account
              - debit_ledger_account
              - amount
              - booked_at
              - document_date
      tags:
        - TransactionService
definitions:
  AccountServiceArchiveAccountBody:
    type: object
  AccountServiceRestoreAccountBody:
    type: object
  AuditLogEntryAction:
    type: string
    enum:
      - ACTION_UNSPECIFIED
      - ACTION_CREATE
      - ACTION_UPDATE
      - ACTION_DELETE
    default: ACTION_UNSPECIFIED
    description: |-
      The kind of change that was recorded.

       - ACTION_UNSPECIFIED: The action is unspecified. Should never be used.
       - ACTION_CREATE: The resource was created.
       - ACTION_UPDATE: The resource was updated (one or more fields changed).
       - ACTION_DELETE: The resource was deleted.
  AuditLogEntryChange:
    type: object
    properties:
      field:
        type: string
        description: The name of the changed field (snake_case, as in the API resource).
      old_value:
        type: string
        description: The field value before the change (empty for creations).
      new_value:
        type: string
        description: The field value after the change (empty for deletions).
    description: |-
      Change describes a single field-level modification within an audit log
      entry. Values are rendered as strings; an empty value means the field was
      absent (or null) in that state. For creations, old_value is empty for all
      changes; for deletions, new_value is empty for all changes.
  BudgetAccountValueServiceBatchUpdateBudgetAccountValuesBody:
    type: object
    properties:
      requests:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1UpdateBudgetAccountValueRequest'
        description: |-
          The request messages specifying the resources to update.
          A maximum of 1000 budget account values can be modified in a batch.
    required:
      - requests
  BudgetServiceCloseBudgetBody:
    type: object
  GroupServiceAddUserToGroupBody:
    type: object
    properties:
      user:
        type: string
        title: |-
          The resource name of the user to add.
          Format: users/{user}
    required:
      - user
  GroupServiceRemoveUserFromGroupBody:
    type: object
    properties:
      user:
        type: string
        title: |-
          The resource name of the user to remove.
          Format: users/{user}
    required:
      - user
  LedgerYearServiceCloseLedgerYearBody:
    type: object
  UserServiceCheckUserPermissionsBody:
    type: object
    properties:
      domain:
        type: string
        description: |-
          The domain to scope the check to (e.g. "organizations/{organization}").
          If empty, permissions are checked against the global domain.
      permissions:
        type: array
        items:
          type: string
        description: |-
          The permissions to evaluate, as "resource:action" strings.
          At least one must be provided. Only the permissions listed here
          are evaluated and returned.
    description: |-
      CheckUserPermissionsRequest checks which of the requested permissions a
      user holds, optionally scoped to a domain.
      When domain is empty, permissions are evaluated against the global
      domain (e.g. users, groups, settings). When set, permissions are evaluated
      against the specified domain (e.g. "organizations/{organization}").
    required:
      - permissions
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  typeDate:
    type: object
    properties:
      year:
        type: integer
        format: int32
        description: |-
          Year of the date. Must be from 1 to 9999, or 0 to specify a date without
          a year.
      month:
        type: integer
        format: int32
        description: |-
          Month of a year. Must be from 1 to 12, or 0 to specify a year without a
          month and day.
      day:
        type: integer
        format: int32
        description: |-
          Day of a month. Must be from 1 to 31 and valid for the year and month, or 0
          to specify a year by itself or a year and month where the day isn't
          significant.
    description: |-
      * A full date, with non-zero year, month, and day values.
      * A month and day, with a zero year (for example, an anniversary).
      * A year on its own, with a zero month and a zero day.
      * A year and month, with a zero day (for example, a credit card expiration
        date).

      Related types:

      * [google.type.TimeOfDay][google.type.TimeOfDay]
      * [google.type.DateTime][google.type.DateTime]
      * [google.protobuf.Timestamp][google.protobuf.Timestamp]
    title: |-
      Represents a whole or partial calendar date, such as a birthday. The time of
      day and time zone are either specified elsewhere or are insignificant. The
      date is relative to the Gregorian Calendar. This can represent one of the
      following:
  v1Account:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the account.
          Format: organizations/{organization}/accounts/{account}
        readOnly: true
      uid:
        type: string
        description: The UUID of the account.
        readOnly: true
      parent_account:
        type: string
        title: |-
          The resource name of the parent account, if any.
          Format: organizations/{organization}/accounts/{account}
      display_name:
        type: string
        description: Human-readable account name.
      display_code:
        type: string
        description: Short account code.
      display_description:
        type: string
        description: Optional free-text description.
      is_container:
        type: boolean
        description: |-
          Whether this account is a container account (cannot hold values directly).
          Immutable after creation.
      is_archived:
        type: boolean
        description: Whether the account is archived (soft-deleted).
        readOnly: true
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: Account represents a budget account in the chart of accounts.
    required:
      - display_name
      - display_code
  v1AccountGroup:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the account group.
          Format: organizations/{organization}/accountGroups/{account_group}
        readOnly: true
      uid:
        type: string
        description: The UUID of the account group.
        readOnly: true
      display_name:
        type: string
        description: Human-readable account group name.
      display_description:
        type: string
        description: Optional free-text description.
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: AccountGroup is a named grouping of budget accounts.
    required:
      - display_name
  v1AccountGroupAssignment:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the assignment.
          Format: organizations/{organization}/accountGroups/{account_group}/assignments/{assignment}
        readOnly: true
      uid:
        type: string
        description: The UUID of the assignment.
        readOnly: true
      account_group:
        type: string
        title: |-
          The resource name of the parent account group.
          Format: organizations/{organization}/accountGroups/{account_group}
        readOnly: true
      account_id:
        type: string
        description: The UUID of the assigned account.
      negate:
        type: boolean
        description: If true, this account is excluded (negated) from the group aggregate.
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: AccountGroupAssignment associates an account with an account group.
    required:
      - account_id
  v1AccountType:
    type: string
    enum:
      - ACCOUNT_TYPE_UNSPECIFIED
      - ACCOUNT_TYPE_ASSET
      - ACCOUNT_TYPE_LIABILITY
      - ACCOUNT_TYPE_EQUITY
      - ACCOUNT_TYPE_REVENUE
      - ACCOUNT_TYPE_EXPENSE
      - ACCOUNT_TYPE_SYSTEM
    default: ACCOUNT_TYPE_UNSPECIFIED
    description: |-
      AccountType defines the classification of a ledger account for transaction interpretation.

       - ACCOUNT_TYPE_UNSPECIFIED: Default value. Not specified.
       - ACCOUNT_TYPE_ASSET: Asset account (e.g., bank accounts, receivables).
       - ACCOUNT_TYPE_LIABILITY: Liability account (e.g., loans, payables).
       - ACCOUNT_TYPE_EQUITY: Equity account (e.g., capital, retained earnings). Treated as LIABILITY for calculations.
       - ACCOUNT_TYPE_REVENUE: Revenue account (e.g., sales, interest income).
       - ACCOUNT_TYPE_EXPENSE: Expense account (e.g., rent, salaries, utilities).
       - ACCOUNT_TYPE_SYSTEM: System account for internal calculations. Special internal use only.
  v1AuditLogEntry:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the audit log entry.
          Format: auditLogEntries/{audit_log_entry}
        readOnly: true
      uid:
        type: string
        description: The UUID of the audit log entry.
        readOnly: true
      resource:
        type: string
        title: |-
          The full resource name of the object this entry refers to.
          Format: e.g. organizations/{organization}/accounts/{account} or users/{user}
        readOnly: true
      organization:
        type: string
        title: |-
          The resource name of the organization the audited resource belongs to.
          Empty for resources that are not subordinated under an organization
          (e.g. users, groups, organizations themselves).
          Format: organizations/{organization}
        readOnly: true
      action:
        $ref: '#/definitions/AuditLogEntryAction'
        description: The kind of change that was recorded.
        readOnly: true
      actor:
        type: string
        title: |-
          The resource name of the user who performed the change.
          Empty if the change was performed by the system.
          Format: users/{user}
        readOnly: true
      changes:
        type: array
        items:
          type: object
          $ref: '#/definitions/AuditLogEntryChange'
        description: The per-field changes recorded by this entry.
        readOnly: true
      timestamp:
        type: string
        format: date-time
        description: The time at which the change was recorded.
        readOnly: true
    description: |-
      AuditLogEntry is an immutable record of a single change to a resource.
      One entry is created per mutating API call: an update that changes multiple
      fields at once results in a single entry containing the per-field diff.
      Entries are append-only and can never be modified or deleted.
  v1BatchCheckUserPermissionsRequest:
    type: object
    properties:
      requests:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1CheckUserPermissionsRequest'
        description: Individual check requests. Maximum 100 entries per call.
    description: |-
      BatchCheckUserPermissionsRequest checks permissions for one or more users
      in a single call (AIP-231 batch pattern). Each entry can target a different
      domain (or the global domain when domain is empty).
    required:
      - requests
  v1BatchCheckUserPermissionsResponse:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1CheckUserPermissionsResponse'
        description: |-
          One result per entry in BatchCheckUserPermissionsRequest.requests,
          in the same order.
        readOnly: true
    description: |-
      BatchCheckUserPermissionsResponse returns one result entry per requested
      check, in the same order as the request.
  v1BatchGetBudgetActualAccountValuesResponse:
    type: object
    properties:
      actual_account_values:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1BudgetActualAccountValue'
        description: |-
          The actual account values returned, in the same order as the names in the
          request. Values with a computed amount of zero or less are omitted.
  v1BatchGetLedgerAccountsResponse:
    type: object
    properties:
      ledger_accounts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1LedgerAccount'
        description: The ledger accounts returned, in the same order as the names in the request.
  v1BatchUpdateBudgetAccountValuesResponse:
    type: object
    properties:
      account_values:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1BudgetAccountValue'
        description: The budget account values that were updated.
  v1Budget:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the budget.
          Format: organizations/{organization}/budgets/{budget}
        readOnly: true
      uid:
        type: string
        description: The UUID of the budget.
        readOnly: true
      display_name:
        type: string
        description: Human-readable budget name.
      display_description:
        type: string
        description: Optional free-text description.
      is_closed:
        type: boolean
        description: Whether the budget is closed (no further modifications allowed).
        readOnly: true
      period_start:
        $ref: '#/definitions/typeDate'
        description: Budget period start date. Immutable after creation.
      period_end:
        $ref: '#/definitions/typeDate'
        description: Budget period end date. Immutable after creation.
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
      is_published:
        type: boolean
        description: |-
          Whether the budget is published. Only published budgets allow their
          revisions to be published.
      publish_actual_values:
        type: boolean
        description: Whether current actual (Ist) account values are publicly visible.
      publish_actual_values_until:
        $ref: '#/definitions/typeDate'
        description: |-
          Optional date until which current actual values are publicly visible.
          Must lie within the budget period. If unset, the end of the budget period
          is assumed.
    description: Budget represents a financial budget with a defined period.
    required:
      - display_name
      - period_start
      - period_end
  v1BudgetAccountValue:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the budget account value.
          Format: organizations/{organization}/budgets/{budget}/accountValues/{account_value}
        readOnly: true
      uid:
        type: string
        description: The UUID of the budget account value.
        readOnly: true
      budget:
        type: string
        title: |-
          The resource name of the parent budget.
          Format: organizations/{organization}/budgets/{budget}
        readOnly: true
      account:
        type: string
        title: |-
          Resource name of the account this value is assigned to.
          Format: organizations/{organization}/accounts/{account}
      value:
        $ref: '#/definitions/v1Decimal'
        description: The target monetary value assigned to the account for this budget.
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: |-
      BudgetAccountValue associates an account with a numeric target value within
      a budget. Accounts may optionally be assigned a value; not all accounts in
      the system need to be present.
    required:
      - account
      - value
  v1BudgetActualAccountValue:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the budget actual account value.
          Format: organizations/{organization}/budgets/{budget}/actualAccountValues/{account}
        readOnly: true
      account:
        type: string
        description: The budget account whose actual value is represented.
        readOnly: true
      budget:
        type: string
        title: |-
          The resource name of the parent budget.
          Format: organizations/{organization}/budgets/{budget}
        readOnly: true
      value:
        $ref: '#/definitions/v1Decimal'
        description: |-
          The computed actual monetary value for this account, derived from the sum
          of all matching TransactionAccountAssignment values within the budget period.
        readOnly: true
    description: |-
      BudgetActualAccountValue is a read-only, server-computed resource that
      represents the actual monetary value for a single budget account within a
      budget. The value is calculated by summing all TransactionAccountAssignment
      values whose parent transactions fall within the budget's period.
  v1BudgetRevision:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the revision.
          Format: organizations/{organization}/budgets/{budget}/revisions/{revision}
        readOnly: true
      uid:
        type: string
        description: The UUID of the revision.
        readOnly: true
      budget:
        type: string
        title: |-
          The resource name of the parent budget.
          Format: organizations/{organization}/budgets/{budget}
        readOnly: true
      display_name:
        type: string
        description: Human-readable name for this revision.
      display_description:
        type: string
        description: Optional free-text description for this revision.
      date:
        $ref: '#/definitions/typeDate'
        description: The date this revision represents.
      create_time:
        type: string
        format: date-time
        description: Timestamp when this revision was created.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
      is_published:
        type: boolean
        description: |-
          Whether the revision is published. A revision can only be published if
          its parent budget is published.
    description: |-
      BudgetRevision is a read-only, point-in-time capture of a Budget's full set
      of BudgetAccountValues. Revisions are immutable after creation and cannot be
      rolled back to. The captured account values are accessible as a paginated
      sub-collection via BudgetRevisionAccountValueService. See AIP-162.
    required:
      - display_name
  v1BudgetRevisionAccountValue:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the budget revision account value.
          Format: organizations/{organization}/budgets/{budget}/revisions/{revision}/accountValues/{account_value}
        readOnly: true
      uid:
        type: string
        description: The UUID of this record.
        readOnly: true
      revision:
        type: string
        title: |-
          The resource name of the parent revision.
          Format: organizations/{organization}/budgets/{budget}/revisions/{revision}
        readOnly: true
      account:
        type: string
        title: |-
          Resource name of the account whose value is recorded here.
          Format: organizations/{organization}/accounts/{account}
        readOnly: true
      value:
        $ref: '#/definitions/v1Decimal'
        description: |-
          The target monetary value for the account at the time the revision was
          created.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Timestamp when this record was created (equals the revision create_time).
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: |-
      BudgetRevisionAccountValue is an immutable record of a single account's
      target value as captured at the time its parent BudgetRevision was created.
      This resource is read-only; it cannot be created, updated, or deleted
      directly — it is populated by the server when the parent BudgetRevision is
      created.
