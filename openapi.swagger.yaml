swagger: "2.0"
info:
  title: VSFV API
  version: v1
  contact:
    name: pixlcrashr
    url: https://pixlcrashr.dev
    email: info@pixlcrashr.dev
tags:
  - name: AccountService
    description: AccountService manages budget accounts in the chart of accounts.
  - name: AccountGroupService
    description: AccountGroupService manages named groupings of budget accounts.
  - name: AccountGroupAssignmentService
    description: AccountGroupAssignmentService manages account memberships within account groups.
  - name: AuditLogService
    description: |-
      AuditLogService provides read-only access to the global, append-only audit
      log. Entries can be retrieved individually by resource name or listed with
      filters. The audit log itself is not bound to any organization: entries for
      resources below an organization carry that organization's resource name and
      can be filtered by it.
  - name: BudgetService
    description: BudgetService manages financial budgets.
  - name: BudgetAccountValueService
    description: BudgetAccountValueService manages per-account value assignments within a budget.
  - name: BudgetActualAccountValueService
    description: |-
      BudgetActualAccountValueService provides read-only access to the computed
      actual monetary values per budget account. Values are derived from the sum of
      TransactionAccountAssignment values for transactions within the budget period.
      All resources in this service are server-computed and immutable.
  - name: BudgetRevisionService
    description: |-
      BudgetRevisionService manages read-only revision history for budgets.
      Revisions are created on demand and capture the full set of
      BudgetAccountValues at the time of creation. Revisions are immutable.
  - name: BudgetRevisionAccountValueService
    description: |-
      BudgetRevisionAccountValueService provides read-only access to the
      per-account values captured within a BudgetRevision. All resources in this
      service are immutable and server-managed.
  - name: GroupService
    description: GroupService manages groups and their per-organization permission policies.
  - name: LedgerAccountService
    description: |-
      LedgerAccountService manages ledger accounts for bookkeeping.
      Accounts are auto-created during import; only Get, List, Update, Delete are exposed.
  - name: LedgerYearService
    description: LedgerYearService manages fiscal/economic years within an organization.
  - name: OrganizationService
    description: OrganizationService manages organizations.
  - name: ReportService
    description: |-
      ReportService manages generated report instances.
      Note: report file download is handled exclusively by the Huma HTTP API.
  - name: ReportTemplateService
    description: ReportTemplateService manages Handlebars templates used for report generation.
  - name: TransactionService
    description: TransactionService manages financial transactions.
  - name: TransactionAssignmentService
    description: TransactionAssignmentService manages transaction assignments to budget accounts.
  - name: UserService
    description: |-
      UserService provides a read-only administrative view of users.
      Users are created exclusively through the SSO/OAuth2 flow.
  - name: UserIdentityService
    description: |-
      UserIdentityService provides a read-only view of the OAuth2 / SSO
      connections linked to a user. No credentials are ever returned.
  - name: UserSettingsService
    description: UserSettingsService manages per-user application preferences.
host: test.pixlcrashr.dev
basePath: /api
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/auditLogEntries:
    get:
      summary: |-
        Lists audit log entries with pagination.
        Callers holding only organization-scoped auditLogs:read permissions
        receive only the entries of the organizations they have access to.
        Authorization:
          Scope: auditLogs:read
          Permission: auditLogs:read
          Domain: global, or organization-scoped
      operationId: AuditLogService_ListAuditLogEntries
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAuditLogEntriesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_size
          description: |-
            Maximum number of audit log entries to return. The service may return fewer.
            If unspecified, at most 100 are returned. Maximum value is 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: page_token
          description: A page token from a previous ListAuditLogEntries call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: resource, actor, action, organization, timestamp.
            Examples: "action=CREATE", "organization=\"organizations/123\"",
            "timestamp>=\"2026-01-01T00:00:00Z\"".
          in: query
          required: false
          type: string
        - name: order_by
          description: |-
            Order by expression (e.g. "timestamp", "timestamp desc"). Defaults to
            "timestamp desc".
          in: query
          required: false
          type: string
      tags:
        - AuditLogService
  /v1/groups:
    get:
      summary: |-
        Lists groups with pagination.
        Authorization:
          Scope: groups:read
          Permission: groups:read
          Domain: global
      operationId: GroupService_ListGroups
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListGroupsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_size
          description: |-
            Maximum number of groups to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: page_token
          description: A page token from a previous ListGroups call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name.
          in: query
          required: false
          type: string
        - name: order_by
          description: Order by expression (e.g. "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - GroupService
    post:
      summary: |-
        Creates a new group.
        Authorization:
          Scope: groups:write
          Permission: groups:create
          Domain: global
      operationId: GroupService_CreateGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Group'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: group
          description: The group to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Group'
        - name: group_id
          description: |-
            The ID to use for the group. If not provided, a system-generated UUID
            will be used. Must be unique across all groups.
          in: query
          required: false
          type: string
      tags:
        - GroupService
  /v1/organizations:
    get:
      summary: |-
        Lists organizations with pagination.
        Authorization:
          Scope: organizations:read
          Permission: organizations:read
          Domain: global
      operationId: OrganizationService_ListOrganizations
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOrganizationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_size
          description: |-
            Maximum number of organizations to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: page_token
          description: A page token from a previous ListOrganizations call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name.
            Example: "display_name=\"Acme\"".
          in: query
          required: false
          type: string
        - name: order_by
          description: Order by expression (e.g. "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - OrganizationService
    post:
      summary: |-
        Creates a new organization.
        Authorization:
          Scope: organizations:write
          Permission: organizations:create
          Domain: global
      operationId: OrganizationService_CreateOrganization
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Organization'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          description: The organization to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Organization'
        - name: organization_id
          description: |-
            The ID to use for the organization. If not provided, a system-generated
            UUID will be used. Must be unique across all organizations.
          in: query
          required: false
          type: string
      tags:
        - OrganizationService
  /v1/organizations:checkId:
    post:
      summary: |-
        Checks whether an organization ID (slug) is available for use.
        Authorization:
          Scope: organizations:read
          Permission: organizations:read
          Domain: global
      operationId: OrganizationService_CheckOrganizationId
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CheckOrganizationIdResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CheckOrganizationIdRequest'
      tags:
        - OrganizationService
  /v1/reportTemplates:generateHtmlPreview:
    post:
      summary: |-
        Generates an HTML preview from a raw template string.
        This is a custom method (AIP-136) independent of any single reportTemplate resource.
        It renders the provided template with sample/fake data for preview purposes.
        Authorization:
          Scope: reportTemplates:read
          Permission: reportTemplates:read
          Domain: global
      operationId: ReportTemplateService_GenerateHtmlPreview
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GenerateHtmlPreviewResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            Request message for generating an HTML preview from a raw template.
            This is a custom method (AIP-136) independent of any single reportTemplate resource.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1GenerateHtmlPreviewRequest'
      tags:
        - ReportTemplateService
  /v1/users:
    get:
      summary: |-
        Lists users with pagination.
        Authorization:
          Scope: users:read
          Permission: users:read
          Domain: global
      operationId: UserService_ListUsers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListUsersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_size
          description: |-
            Maximum number of users to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: page_token
          description: A page token from a previous ListUsers call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name, email, is_active.
          in: query
          required: false
          type: string
        - name: order_by
          description: Order by expression (e.g. "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - UserService
  /v1/users:batchCheckPermissions:
    post:
      summary: |-
        Checks permissions for one or more users in one call, each optionally
        scoped to a different domain (batch custom method, AIP-231).
        Authorization:
          Scope: users:read
          Permission: users:read
          Domain: global
      operationId: UserService_BatchCheckUserPermissions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1BatchCheckUserPermissionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            BatchCheckUserPermissionsRequest checks permissions for one or more users
            in a single call (AIP-231 batch pattern). Each entry can target a different
            domain (or the global domain when domain is empty).
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1BatchCheckUserPermissionsRequest'
      tags:
        - UserService
  /v1/{account.name}:
    patch:
      summary: |-
        Updates an existing account.
        Authorization:
          Scope: accounts:write
          Permission: accounts:update
          Domain: organization-scoped
      operationId: AccountService_UpdateAccount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Account'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: account.name
          description: |-
            The resource name of the account.
            Format: organizations/{organization}/accounts/{account}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/accounts/[^/]+
        - name: account
          description: The account to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the account.
                readOnly: true
              parent_account:
                type: string
                title: |-
                  The resource name of the parent account, if any.
                  Format: organizations/{organization}/accounts/{account}
              display_name:
                type: string
                description: Human-readable account name.
              display_code:
                type: string
                description: Short account code.
              display_description:
                type: string
                description: Optional free-text description.
              is_container:
                type: boolean
                description: |-
                  Whether this account is a container account (cannot hold values directly).
                  Immutable after creation.
              is_archived:
                type: boolean
                description: Whether the account is archived (soft-deleted).
                readOnly: true
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The account to update.
            required:
              - display_name
              - display_code
      tags:
        - AccountService
  /v1/{account_group.name}:
    patch:
      summary: |-
        Updates an existing account group.
        Authorization:
          Scope: accountGroups:write
          Permission: accountGroups:update
          Domain: organization-scoped
      operationId: AccountGroupService_UpdateAccountGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AccountGroup'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: account_group.name
          description: |-
            The resource name of the account group.
            Format: organizations/{organization}/accountGroups/{account_group}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/accountGroups/[^/]+
        - name: account_group
          description: The account group to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the account group.
                readOnly: true
              display_name:
                type: string
                description: Human-readable account group name.
              display_description:
                type: string
                description: Optional free-text description.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The account group to update.
            required:
              - display_name
      tags:
        - AccountGroupService
  /v1/{account_value.name}:
    patch:
      summary: |-
        Updates an existing budget account value.
        Authorization:
          Scope: budgets:write
          Permission: budgets:update
          Domain: organization-scoped
      operationId: BudgetAccountValueService_UpdateBudgetAccountValue
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1BudgetAccountValue'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: account_value.name
          description: |-
            The resource name of the budget account value.
            Format: organizations/{organization}/budgets/{budget}/accountValues/{account_value}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/budgets/[^/]+/accountValues/[^/]+
        - name: account_value
          description: The budget account value to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the budget account value.
                readOnly: true
              budget:
                type: string
                title: |-
                  The resource name of the parent budget.
                  Format: organizations/{organization}/budgets/{budget}
                readOnly: true
              account:
                type: string
                title: |-
                  Resource name of the account this value is assigned to.
                  Format: organizations/{organization}/accounts/{account}
              value:
                $ref: '#/definitions/v1Decimal'
                description: The target monetary value assigned to the account for this budget.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The budget account value to update.
            required:
              - account
              - value
        - name: allow_missing
          description: |-
            If set to true, and the resource is not found, a new resource will be
            created. In this situation, update_mask is ignored.
          in: query
          required: false
          type: boolean
      tags:
        - BudgetAccountValueService
  /v1/{assignment.name_1}:
    patch:
      summary: |-
        Updates an existing transaction assignment.
        Authorization:
          Scope: transactions:write
          Permission: transactions:update
          Domain: organization-scoped
      operationId: TransactionAssignmentService_UpdateTransactionAssignment
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1TransactionAssignment'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: assignment.name_1
          description: |-
            The resource name of the transaction assignment.
            Format: organizations/{organization}/transactions/{transaction}/assignments/{assignment}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/transactions/[^/]+/assignments/[^/]+
        - name: assignment
          description: The transaction assignment to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the transaction assignment.
                readOnly: true
              transaction:
                type: string
                title: |-
                  Resource name of the parent transaction.
                  Format: organizations/{organization}/transactions/{transaction}
              account:
                type: string
                title: |-
                  Resource name of the account this transaction is assigned to.
                  Format: organizations/{organization}/accounts/{account}
              value:
                $ref: '#/definitions/v1Decimal'
                description: The assigned value amount.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
            title: The transaction assignment to update.
            required:
              - account
              - value
      tags:
        - TransactionAssignmentService
  /v1/{assignment.name}:
    patch:
      summary: |-
        Updates an existing assignment.
        Authorization:
          Scope: accountGroups:write
          Permission: accountGroups:update
          Domain: organization-scoped
      operationId: AccountGroupAssignmentService_UpdateAccountGroupAssignment
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AccountGroupAssignment'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: assignment.name
          description: |-
            The resource name of the assignment.
            Format: organizations/{organization}/accountGroups/{account_group}/assignments/{assignment}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/accountGroups/[^/]+/assignments/[^/]+
        - name: assignment
          description: The assignment to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the assignment.
                readOnly: true
              account_group:
                type: string
                title: |-
                  The resource name of the parent account group.
                  Format: organizations/{organization}/accountGroups/{account_group}
                readOnly: true
              account_id:
                type: string
                description: The UUID of the assigned account.
              negate:
                type: boolean
                description: If true, this account is excluded (negated) from the group aggregate.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The assignment to update.
            required:
              - account_id
      tags:
        - AccountGroupAssignmentService
  /v1/{budget.name}:
    patch:
      summary: |-
        Updates an existing budget.
        Authorization:
          Scope: budgets:write
          Permission: budgets:update
          Domain: organization-scoped
      operationId: BudgetService_UpdateBudget
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Budget'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: budget.name
          description: |-
            The resource name of the budget.
            Format: organizations/{organization}/budgets/{budget}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/budgets/[^/]+
        - name: budget
          description: The budget to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the budget.
                readOnly: true
              display_name:
                type: string
                description: Human-readable budget name.
              display_description:
                type: string
                description: Optional free-text description.
              is_closed:
                type: boolean
                description: Whether the budget is closed (no further modifications allowed).
                readOnly: true
              period_start:
                $ref: '#/definitions/typeDate'
                description: Budget period start date. Immutable after creation.
              period_end:
                $ref: '#/definitions/typeDate'
                description: Budget period end date. Immutable after creation.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
              is_published:
                type: boolean
                description: |-
                  Whether the budget is published. Only published budgets allow their
                  revisions to be published.
              publish_actual_values:
                type: boolean
                description: Whether current actual (Ist) account values are publicly visible.
              publish_actual_values_until:
                $ref: '#/definitions/typeDate'
                description: |-
                  Optional date until which current actual values are publicly visible.
                  Must lie within the budget period. If unset, the end of the budget period
                  is assumed.
            title: The budget to update.
            required:
              - display_name
              - period_start
              - period_end
      tags:
        - BudgetService
  /v1/{group.name}:
    patch:
      summary: |-
        Updates an existing group.
        Authorization:
          Scope: groups:write
          Permission: groups:update
          Domain: global
      operationId: GroupService_UpdateGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Group'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: group.name
          description: |-
            The resource name of the group.
            Format: groups/{group}
          in: path
          required: true
          type: string
          pattern: groups/[^/]+
        - name: group
          description: The group to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the group.
                readOnly: true
              display_name:
                type: string
                description: Human-readable group name.
              display_description:
                type: string
                description: Optional free-text description.
              organizations:
                type: array
                items:
                  type: string
                title: |-
                  Organizations this group is assigned to (resource names).
                  Format: organizations/{organization}
              permissions:
                type: array
                items:
                  type: string
                description: |-
                  Self-standing permissions granted to this group.
