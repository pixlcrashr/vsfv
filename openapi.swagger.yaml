        description: |-
          The subject identifier as issued by the provider.
          This is the provider's stable user ID, not a credential.
        readOnly: true
      display_name:
        type: string
        description: Display name as returned by the provider at last authentication.
        readOnly: true
      email:
        type: string
        description: E-mail address as returned by the provider at last authentication.
        readOnly: true
      last_authenticated_time:
        type: string
        format: date-time
        description: Timestamp of the most recent successful authentication via this identity.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Timestamp when this identity was first linked.
        readOnly: true
    description: |-
      UserIdentity is a read-only record of an OAuth2 / SSO connection linked to a
      user.
  v1UserSettings:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the user settings.
          Format: users/{user}/settings
        readOnly: true
      locale:
        type: string
        description: Preferred locale/language tag (e.g. "de-DE").
      theme:
        type: string
        description: 'Preferred UI theme: "light", "dark", or "system".'
      email_notifications:
        type: boolean
        description: Whether the user wants to receive email notifications.
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: UserSettings holds per-user application preferences.
